  const code=m.bal==="Victoria"?"V":m.bal==="Derrota"?"D":"P";
  const body=m.res?`<div class="score">${a} - ${b} <small style="font-size:11px;color:var(--mut)">${ext}</small></div>`:`<div class="tbc">Resultado pendiente</div>`;
  return `<div class="card c${m.c}"><div class="res"><div style="min-width:0"><div class="meta2">${cap(fmtDate(m))} &middot; Jornada ${m.j}</div><div class="vs2">${esc(m.loc)} <small>-</small> ${esc(m.vis)}</div><div class="meta2">${ctag(m)}${oppLine(m)}</div></div><div style="text-align:right"><div style="display:flex;gap:8px;align-items:center;justify-content:flex-end">${body}<div class="badge ${code}">${code==="P"?"?":code}</div></div><div class="meta2">${m.res?"Local - Visitante":""}</div></div></div></div>`;
}
const calCard=m=>m.res?resCard(m).replace('class="card ','class="card past '):nextCard(m);
function viewNext(){
  const l=DATA.filter(m=>m.upcoming&&filt(m)&&(!st.home||m.isHome)).sort((a,b)=>a.s-b.s);
  if(!l.length)return '<div class="empty">No hay próximos partidos con este filtro.</div>';
  const sh=l.slice(0,st.n);
  let h=`<h2>Próximos ${sh.length} partidos</h2>`+heroCard(sh[0])+sh.slice(1).map(nextCard).join("");
  if(l.length>st.n)h+=`<button class="more" onclick="st.n+=5;render()">Ver 5 más (${l.length-st.n} restantes)</button>`;
  const last=["ACB","LF","EU"].filter(e=>st.c==="Todos"||st.c===e).map(e=>DATA.filter(m=>!m.upcoming&&m.res&&m.c===e).sort((a,b)=>b.s-a.s)[0]).filter(Boolean);
  if(last.length)h+="<h2>Último resultado por competición</h2>"+last.map(resCard).join("");
  return h;
}
function viewRes(){
  const done=DATA.filter(m=>!m.upcoming&&filt(m)).sort((a,b)=>b.s-a.s),played=done.filter(m=>m.res);
  const w=played.filter(m=>m.bal==="Victoria").length,d=played.length-w;let h="";
  if(st.c==="Todos")h+='<div class="rec">'+["ACB","LF","EU"].map(c=>{const pl=DATA.filter(m=>m.res&&m.c===c),v=pl.filter(m=>m.bal==="Victoria").length;return `<div class="card c${c}"><b>${v}-${pl.length-v}</b><div class="meta2">${CS[c]}</div></div>`}).join("")+"</div>";
  h+=`<div class="sumg"><div class="card"><b>${w}-${d}</b><div class="meta2">Victorias-derrotas</div></div><div class="card"><div class="form" style="justify-content:center">${played.slice(0,5).map(m=>`<div class="badge ${m.bal==="Victoria"?"V":"D"}">${m.bal==="Victoria"?"V":"D"}</div>`).join("")}</div><div class="meta2" style="margin-top:6px">Últimos ${Math.min(5,played.length)}</div></div></div><h2>Resultados anteriores</h2>`;
  return h+(done.length?done.map(resCard).join(""):'<div class="empty">Todavía no hay resultados.</div>');
}
function viewCal(){
  const l=DATA.filter(m=>filt(m)&&(!st.home||m.isHome)).sort((a,b)=>a.s-b.s);let h="",cur="";
  l.forEach(m=>{const k=new Date(dayMs(m)).toLocaleDateString("es-ES",{timeZone:"UTC",month:"long",year:"numeric"});if(k!==cur){cur=k;h+=`<h2>${cap(k)}</h2>`}h+=calCard(m)});
  return h||'<div class="empty">Sin partidos.</div>';
}
function render(){
  document.getElementById("main").innerHTML=st.tab==="next"?viewNext():st.tab==="res"?viewRes():viewCal();
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.v===st.c));
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===st.tab));
  document.getElementById("homeopt").style.display=st.tab==="res"?"none":"flex";
}
function hdr(){document.getElementById("upd").textContent="V4 · Datos: "+UPDATED+" ("+FUENTE+") · Hoy: "+cap(new Date(TODAY).toLocaleDateString("es-ES",{timeZone:"UTC",weekday:"long",day:"numeric",month:"long"}));
document.getElementById("pos").innerHTML=POS.map(v=>`<div>${v[0]}<b>${v[1]}</b></div>`).join("")}
document.getElementById("seg").innerHTML=[["Todos","Todos",""],["ACB","Liga ACB (masc.)",COL.ACB],["LF","Liga Femenina",COL.LF],["EU","EuroLeague Women",COL.EU]].map(([v,t,c])=>`<button data-v="${v}">${c?`<i style="background:${c}"></i>`:""}${t}</button>`).join("");
document.getElementById("nav").innerHTML=[["next","🏀","Próximos"],["res","📊","Resultados"],["cal","📅","Calendario"]].map(([v,i,t])=>`<button data-v="${v}"><span>${i}</span>${t}</button>`).join("");
document.getElementById("seg").onclick=e=>{const b=e.target.closest("button");if(b){st.c=b.dataset.v;st.n=5;render()}};
document.getElementById("nav").onclick=e=>{const b=e.target.closest("button");if(b){st.tab=b.dataset.v;st.n=5;render();scrollTo(0,0)}};
document.getElementById("home").onchange=e=>{st.home=e.target.checked;st.n=5;render()};
hdr();render();
/* Lee datos.json (mismo sitio web). Si falla, se queda con la copia guardada. */
function cargar(){
  fetch("datos.json?t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{
    if(!j||!Array.isArray(j.partidos)||!j.partidos.length)throw 0;
    DATA=j.partidos;UPDATED=j.actualizado||UPDATED;if(Array.isArray(j.posiciones))POS=j.posiciones;FUENTE="en línea";prep();hdr();render();
  }).catch(()=>{});
}
cargar();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)cargar()});
</script></body></html>
