name: Actualizar resultados
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python actualizar_datos.py
      - name: Guardar cambios
        run: |
          git config user.name "actualizador"
          git config user.email "actions@users.noreply.github.com"
          git add datos.json clasificacion.json
          git diff --cached --quiet || (git commit -m "Actualizar resultados" && git push)
